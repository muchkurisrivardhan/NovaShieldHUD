# Push a tag like v0.6.0 and this builds both installers, runs the self-tests and publishes a
# GitHub release. Beacon's Settings > General > "Check for updates" then offers it to everyone.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Self-tests
        shell: pwsh
        run: |
          dotnet build -c Release dotline/Dotline.csproj -nologo -v q
          dotnet dotline/bin/Release/net10.0-windows/Dotline.dll --selftest; if ($LASTEXITCODE) { exit 1 }

      - name: Inno Setup
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Installers
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          ./installer/build.ps1 -Arch x64 -Version $v
          ./installer/build.ps1 -Arch arm64 -Version $v
          Get-ChildItem installer/out/*.exe | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content installer/out/SHA256SUMS.txt -Encoding ascii
          Get-Content installer/out/SHA256SUMS.txt

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' --title "NovaShield HUD ${{ github.ref_name }}" --generate-notes `
            installer/out/NovaShieldHUD-Setup-x64.exe installer/out/NovaShieldHUD-Setup-arm64.exe installer/out/SHA256SUMS.txt
